name: E2E

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      ios_module:
        description: "iOS e2e module (scripts/test-ios-e2e-suite.sh --list)"
        required: false
        default: "smoke"
      android_module:
        description: "Android e2e module (scripts/test-android-e2e.sh --list)"
        required: false
        default: "smoke"
  schedule:
    # Nightly full-suite coverage; PRs and pushes run the small smoke modules.
    - cron: "37 3 * * *"

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IOS_MODULE: ${{ inputs.ios_module || (github.event_name == 'schedule' && 'all' || 'smoke') }}
  ANDROID_MODULE: ${{ inputs.android_module || (github.event_name == 'schedule' && 'all' || 'smoke') }}

jobs:
  # The lockfile's source archive is shared across Linux and macOS.
  duniverse:
    name: Vendor duniverse
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ocaml-vendor
        with:
          mode: prepare

  ios-e2e:
    name: iOS e2e
    needs: duniverse
    runs-on: macos-15
    timeout-minutes: 90
    env:
      LOGSEQ_OPAM_SWITCH: ${{ github.workspace }}
      DUNE_CACHE: enabled
      DUNE_CACHE_STORAGE_MODE: copy
      HOMEBREW_NO_AUTO_UPDATE: "1"
      # SwiftPM clones lui over ssh://; rewrite to https (repos are public).
      GIT_CONFIG_COUNT: 3
      GIT_CONFIG_KEY_0: url.https://github.com/.insteadOf
      GIT_CONFIG_VALUE_0: "git@github.com:"
      GIT_CONFIG_KEY_1: url.https://github.com/.insteadOf
      GIT_CONFIG_VALUE_1: "ssh://git@github.com/"
      GIT_CONFIG_KEY_2: url.https://github.com/.insteadOf
      GIT_CONFIG_VALUE_2: "git+ssh://git@github.com/"
    steps:
      - uses: actions/checkout@v4

      - name: Fingerprint iOS E2E build inputs
        id: ios-build-inputs
        shell: bash
        # Git already records the tracked paths, file modes and content hashes.
        # Reading the index avoids walking and rehashing the checkout on the runner.
        run: |
          fingerprint=$(git ls-files --stage -z -- \
            ':(top,glob)apple/Package*' apple/Sources apple/App shared scripts \
            ':(top,exclude,glob)scripts/test-*' \
            ':(top,glob)dune*' ':(top,glob)logseq.opam*' version.xcconfig \
            .github/actions/ocaml-tools/action.yml .github/actions/ocaml-vendor/action.yml \
            | git hash-object --stdin)
          echo "value=$fingerprint" >> "$GITHUB_OUTPUT"

      - name: Select Xcode 26
        # lui declares swift-tools-version 6.2; the image default (16.4) ships
        # Swift 6.1, so select the Xcode 26 toolchain (Swift 6.2).
        run: sudo xcode-select --switch /Applications/Xcode_26.3.app

      - name: Start db-sync server (background)
        id: ios-db-sync
        # Build it while the simulator boots and the app builds.
        uses: ./.github/actions/db-sync-server
        with:
          background: "true"

      - name: Boot an iOS simulator
        # simctl boot returns as soon as the boot is initiated; the device
        # finishes booting while the app builds, and bootstatus gates later.
        run: |
          runtime_id=$(xcrun simctl list -j runtimes | python3 -c 'import json,sys; rs=[r for r in json.load(sys.stdin)["runtimes"] if r.get("isAvailable") and ".iOS-" in r["identifier"]]; rs.sort(key=lambda r: [int(x) for x in r["version"].split(".")]); print(rs[-1]["identifier"])')
          udid=$(xcrun simctl create "CI iPhone" \
            "com.apple.CoreSimulator.SimDeviceType.iPhone-16" "$runtime_id")
          xcrun simctl boot "$udid"
          echo "LOGSEQ_IOS_SIMULATOR_UDID=$udid" >> "$GITHUB_ENV"

      - name: Restore iOS E2E binaries
        # Runner-only edits do not change the app or seed executable.
        id: ios-e2e-binaries
        uses: actions/cache/restore@v4
        with:
          path: |
            apple/.build/Logseq.app
            _build/default/shared/native/logseq_e2e_seed.exe
          key: ios-e2e-binaries-v2-${{ runner.os }}-${{ runner.arch }}-xcode26.3-debug-ios17-${{ env.IOS_MODULE }}-${{ steps.ios-build-inputs.outputs.value }}

      - name: System dependencies
        if: steps.ios-e2e-binaries.outputs.cache-hit != 'true'
        run: brew install sdl2 sdl2_ttf

      - uses: ./.github/actions/ocaml-tools
        if: steps.ios-e2e-binaries.outputs.cache-hit != 'true'
        with:
          image: macos-15

      - uses: ./.github/actions/ocaml-vendor
        if: steps.ios-e2e-binaries.outputs.cache-hit != 'true'

      - name: Restore iOS OCaml toolchain
        id: ios-toolchain
        if: steps.ios-e2e-binaries.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            _build/apple-toolchains/ios/host-5.5.0
            _build/apple-toolchains/ios/arm64-apple-ios17.0-simulator-5.5.0
            _build/apple-toolchains/ios/libffi-arm64-apple-ios17.0-simulator
          key: apple-toolchain-${{ runner.os }}-xcode26.3-ios-simulator-5.5.0-${{ hashFiles('scripts/bootstrap-ios-ocaml.sh', 'scripts/build-mobile-libffi.sh') }}

      - name: Restore legacy iOS OCaml toolchain cache
        id: ios-toolchain-legacy
        if: steps.ios-toolchain.outputs.cache-primary-key != '' && steps.ios-toolchain.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: _build/apple-toolchains
          key: ${{ steps.ios-toolchain.outputs.cache-primary-key }}

      - name: Select build cache week
        id: cache-week
        if: steps.ios-e2e-binaries.outputs.cache-hit != 'true'
        run: date -u '+value=%G-W%V' >> "$GITHUB_OUTPUT"

      - name: Restore iOS Simulator Dune cache
        id: ios-dune
        if: steps.ios-e2e-binaries.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/dune
          key: ios-simulator-dune-v2-${{ runner.arch }}-xcode26.3-${{ steps.cache-week.outputs.value }}
          restore-keys: |
            ios-simulator-dune-v2-${{ runner.arch }}-xcode26.3-
            ios-simulator-dune-v1-${{ runner.arch }}-xcode26.3-

      - name: Read the Sentry pin
        id: sentry
        if: steps.ios-e2e-binaries.outputs.cache-hit != 'true'
        run: |
          revision=$(jq -er '.pins[] | select(.identity == "sentry-cocoa") | .state.revision' apple/Package.resolved)
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

      - name: Restore Swift package downloads
        id: swift-downloads
        if: steps.ios-e2e-binaries.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            apple/.build/repositories
            ~/Library/Caches/org.swift.swiftpm/artifacts/https___github_com_getsentry_sentry_cocoa_releases_download_*
          key: ios-simulator-swift-downloads-v1-${{ runner.arch }}-xcode26.3-${{ steps.sentry.outputs.revision }}

      - name: Restore simulator extensions
        id: ios-extensions
        if: steps.ios-e2e-binaries.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            _build/ios-core/simulator/extensions/Debug/LogseqShareExtension.appex
            _build/ios-core/simulator/extensions/Debug/LogseqWidgets.appex
          key: ios-simulator-extensions-v1-${{ runner.arch }}-xcode26.3-debug-ios17-${{ hashFiles('apple/App/Logseq.xcodeproj/project.pbxproj', 'apple/App/Logseq.xcconfig', 'apple/App/Assets.xcassets/**', 'apple/App/ShareExtension/**', 'apple/App/Widgets/**', 'apple/App/Sources/QuickActions.swift', 'apple/Sources/Logseq/RecordingActivity.swift', 'apple/Sources/Logseq/LGImageCompression.swift', 'version.xcconfig', 'scripts/build-mobile-ios-simulator.sh') }}

      - name: Build iOS app for the simulator
        if: steps.ios-e2e-binaries.outputs.cache-hit != 'true'
        env:
          LOGSEQ_IOS_REUSE_EXTENSIONS: ${{ steps.ios-extensions.outputs.cache-hit == 'true' && '1' || '0' }}
        run: opam exec -- ./scripts/build-mobile-ios-simulator.sh

      - name: Save simulator extensions
        if: github.ref == 'refs/heads/main' && steps.ios-extensions.outputs.cache-primary-key != '' && steps.ios-extensions.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            _build/ios-core/simulator/extensions/Debug/LogseqShareExtension.appex
            _build/ios-core/simulator/extensions/Debug/LogseqWidgets.appex
          key: ${{ steps.ios-extensions.outputs.cache-primary-key }}

      - name: Save Swift package downloads
        if: github.ref == 'refs/heads/main' && steps.swift-downloads.outputs.cache-primary-key != '' && steps.swift-downloads.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            apple/.build/repositories
            ~/Library/Caches/org.swift.swiftpm/artifacts/https___github_com_getsentry_sentry_cocoa_releases_download_*
          key: ${{ steps.swift-downloads.outputs.cache-primary-key }}

      - name: Build iOS E2E fixture seed tool
        if: steps.ios-e2e-binaries.outputs.cache-hit != 'true' && env.IOS_MODULE != 'smoke' && env.IOS_MODULE != 'composer'
        run: opam exec -- dune build shared/native/logseq_e2e_seed.exe

      - name: Save iOS E2E binaries
        if: success() && steps.ios-e2e-binaries.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            apple/.build/Logseq.app
            _build/default/shared/native/logseq_e2e_seed.exe
          key: ${{ steps.ios-e2e-binaries.outputs.cache-primary-key }}

      - name: Bound the iOS Simulator Dune cache
        if: github.ref == 'refs/heads/main' && steps.ios-dune.outputs.cache-hit != 'true' && steps.ios-dune.outputs.cache-primary-key != ''
        run: opam exec -- dune cache trim --size=512MiB

      - name: Save iOS Simulator Dune cache
        if: github.ref == 'refs/heads/main' && steps.ios-dune.outputs.cache-hit != 'true' && steps.ios-dune.outputs.cache-primary-key != ''
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/dune
          key: ${{ steps.ios-dune.outputs.cache-primary-key }}

      - name: Save iOS OCaml toolchain
        # Keep a completed toolchain even if a later compilation failed.
        if: >-
          always() && steps.ios-toolchain.outputs.cache-primary-key != '' &&
          steps.ios-toolchain.outputs.cache-hit != 'true' &&
          hashFiles('_build/apple-toolchains/ios/host-5.5.0/.logseq-toolchain-complete') != '' &&
          hashFiles('_build/apple-toolchains/ios/arm64-apple-ios17.0-simulator-5.5.0/.logseq-toolchain-complete') != '' &&
          hashFiles('_build/apple-toolchains/ios/libffi-arm64-apple-ios17.0-simulator/.libffi-*-complete') != '' &&
          hashFiles('_build/apple-toolchains/ios/libffi-arm64-apple-ios17.0-simulator/lib/libffi.a') != ''
        uses: actions/cache/save@v4
        with:
          path: |
            _build/apple-toolchains/ios/host-5.5.0
            _build/apple-toolchains/ios/arm64-apple-ios17.0-simulator-5.5.0
            _build/apple-toolchains/ios/libffi-arm64-apple-ios17.0-simulator
          key: ${{ steps.ios-toolchain.outputs.cache-primary-key }}

      - uses: ./.github/actions/maestro

      - name: Wait for db-sync and the simulator
        run: |
          for attempt in $(seq 1 180); do
            if curl -s -o /dev/null "http://127.0.0.1:8787/"; then
              echo "db-sync is listening on :8787"
              grep -E '^(Using cached db-sync runtime|Building db-sync runtime|db-sync runtime prepared in )' \
                logseq-server/deps/db-sync/build.log || true
              break
            fi
            if [[ $attempt == 180 ]]; then
              echo "db-sync did not come up; build log:" >&2
              tail -100 logseq-server/deps/db-sync/build.log >&2 || true
              tail -100 logseq-server/deps/db-sync/db-sync.log >&2 || true
              exit 1
            fi
            sleep 2
          done
          xcrun simctl bootstatus "$LOGSEQ_IOS_SIMULATOR_UDID" -b

      - name: Save iOS db-sync runtime
        if: steps.ios-db-sync.outputs.cache-key != '' && steps.ios-db-sync.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/db-sync-runtime
          key: ${{ steps.ios-db-sync.outputs.cache-key }}

      - name: Run iOS e2e module
        timeout-minutes: ${{ env.IOS_MODULE == 'smoke' && 20 || 60 }}
        env:
          LOGSEQ_E2E_SEED_BIN: ${{ github.workspace }}/_build/default/shared/native/logseq_e2e_seed.exe
          LOGSEQ_IOS_SKIP_BUILD: "1"
        run: ./scripts/test-ios-e2e-suite.sh "$IOS_MODULE"

      - name: Upload Maestro debug artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-maestro-debug
          path: ~/.maestro/tests
          retention-days: 7
          if-no-files-found: ignore

  android-e2e:
    name: Android e2e
    needs: duniverse
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    env:
      LOGSEQ_OPAM_SWITCH: ${{ github.workspace }}
      LOGSEQ_ANDROID_ABI: x86_64
      LOGSEQ_E2E_BASE_URL: http://127.0.0.1:8787
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space for the emulator
        if: runner.environment == 'github-hosted'
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/.ghcup
          df -h /

      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev libffi-dev pkg-config libsdl2-dev libsdl2-ttf-dev libsdl3-dev libpango1.0-dev

      - uses: ./.github/actions/ocaml-tools
        with:
          image: ubuntu-26.04

      - uses: ./.github/actions/ocaml-vendor

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - uses: ./.github/actions/maestro

      - name: Verify Android native ABI configuration
        run: python3 scripts/test-android-native-packaging.py

      - name: Restore Android OCaml toolchain
        id: android-toolchain
        uses: actions/cache/restore@v4
        with:
          path: |
            _build/android-toolchain
            _build/android-dependency-sources
            _build/android-sqlite-host
          key: android-toolchain-${{ runner.os }}-x86_64-5.5.0-${{ hashFiles('scripts/bootstrap-android-ocaml.sh', 'scripts/build-mobile-libffi.sh') }}

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Start db-sync server (background)
        id: android-db-sync
        # Builds while the emulator boots and the APK compiles; the next
        # step polls the port before the flows run.
        uses: ./.github/actions/db-sync-server
        with:
          background: "true"

      - name: Run Android e2e module
        uses: reactivecircus/android-emulator-runner@v2
        env:
          # pub get clones the lui git dep over ssh; rewrite to https
          # (file-based git config doesn't reliably reach the
          # emulator-runner's script environment).
          GIT_CONFIG_COUNT: 3
          GIT_CONFIG_KEY_0: url.https://github.com/.insteadOf
          GIT_CONFIG_VALUE_0: "git@github.com:"
          GIT_CONFIG_KEY_1: url.https://github.com/.insteadOf
          GIT_CONFIG_VALUE_1: ssh://git@github.com/
          GIT_CONFIG_KEY_2: url.https://github.com/.insteadOf
          GIT_CONFIG_VALUE_2: git+ssh://git@github.com/
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 600
          script: |
            eval $(opam env)
            export LOGSEQ_OPAM_SWITCH="$(opam switch show)"
            export DUNE="$(command -v dune)"
            if ! ./android/gradlew -p android :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.logseq.logseq.AndroidTaskDateSheetTest; then
              adb logcat -d -s TestRunner AndroidRuntime
              find android/app/build/outputs/androidTest-results -name '*.xml' -exec cat {} +
              exit 1
            fi
            ./scripts/test-android-e2e.sh "$ANDROID_MODULE"

      - name: Upload Maestro debug artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-maestro-debug
          path: ~/.maestro/tests
          retention-days: 7
          if-no-files-found: ignore

      - name: Save Android db-sync runtime
        if: steps.android-db-sync.outputs.cache-key != '' && steps.android-db-sync.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/db-sync-runtime
          key: ${{ steps.android-db-sync.outputs.cache-key }}

      - name: Save Android OCaml toolchain
        if: always() && steps.android-toolchain.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            _build/android-toolchain
            _build/android-dependency-sources
            _build/android-sqlite-host
          key: android-toolchain-${{ runner.os }}-x86_64-5.5.0-${{ hashFiles('scripts/bootstrap-android-ocaml.sh', 'scripts/build-mobile-libffi.sh') }}
