name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  ocaml-core:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4

      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev libffi-dev pkg-config libsdl2-dev libsdl2-ttf-dev libsdl3-dev libpango1.0-dev

      - uses: ./.github/actions/ocaml-tools
        with:
          image: ubuntu-26.04

      - uses: ./.github/actions/ocaml-vendor
        with:
          mode: populate

      - name: Select build cache week
        id: cache-week
        run: date -u '+value=%G-W%V' >> "$GITHUB_OUTPUT"

      - name: Restore OCaml core Dune cache
        id: dune
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/dune
          key: ocaml-core-dune-v1-${{ runner.arch }}-${{ steps.cache-week.outputs.value }}
          restore-keys: |
            ocaml-core-dune-v1-${{ runner.arch }}-
            build-cache-main-

      - name: Enable dune shared cache
        run: |
          mkdir -p ~/.config/dune
          printf '(lang dune 3.0)\n(cache enabled)\n' > ~/.config/dune/config

      - name: Build and test OCaml core
        run: opam exec -- dune build @shared/native/runtest

      - name: Trim OCaml core Dune cache
        # PR jobs can restore from main. Their own caches cannot be reused by main.
        if: github.ref == 'refs/heads/main' && steps.dune.outputs.cache-hit != 'true'
        run: opam exec -- dune cache trim --size=512MiB

      - name: Save OCaml core Dune cache
        if: github.ref == 'refs/heads/main' && steps.dune.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/dune
          key: ${{ steps.dune.outputs.cache-primary-key }}
