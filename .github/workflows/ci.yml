name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  ocaml-core:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4

      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev libffi-dev pkg-config libsdl2-dev libsdl2-ttf-dev libsdl3-dev libpango1.0-dev

      - uses: ./.github/actions/ocaml-tools
        with:
          image: ubuntu-26.04

      - uses: ./.github/actions/ocaml-vendor
        with:
          populate: "true"

      - name: Restore build caches
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/dune
          key: build-cache-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            build-cache-${{ github.ref_name }}-
            build-cache-main-

      - name: Enable dune shared cache
        run: |
          mkdir -p ~/.config/dune
          printf '(lang dune 3.0)\n(cache enabled)\n' > ~/.config/dune/config

      - name: Build and test OCaml core
        run: opam exec -- dune build @shared/native/runtest

      - name: Save build caches
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/dune
          key: build-cache-${{ github.ref_name }}-${{ github.sha }}
