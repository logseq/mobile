# Builds signed Android APK/AAB artifacts and publishes the bundle to Google
# Play internal testing. Disable upload-play for the first manual Play upload.

name: Build-Android

on:
  workflow_dispatch:
    inputs:
      git-ref:
        description: "Release Git Ref (Which branch or tag to build?)"
        required: true
        default: "main"
      upload-play:
        description: "Publish to Google Play internal testing (disable for first manual upload)"
        type: boolean
        default: true
      release-status:
        description: "Use draft until the app's first release has been published in Play Console"
        type: choice
        options:
          - completed
          - draft
        default: completed

permissions:
  contents: read

concurrency:
  group: android-play-internal
  cancel-in-progress: false

env:
  JAVA_VERSION: '21'
  ANDROID_BUILD_TOOLS_VERSION: '37.0.0'
  LOGSEQ_ANDROID_ABI: arm64-v8a

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      LOGSEQ_OPAM_SWITCH: ${{ github.workspace }}
      GIT_TERMINAL_PROMPT: "0"
      GIT_CONFIG_COUNT: 3
      GIT_CONFIG_KEY_0: url.https://github.com/.insteadOf
      GIT_CONFIG_VALUE_0: "git@github.com:"
      GIT_CONFIG_KEY_1: url.https://github.com/.insteadOf
      GIT_CONFIG_VALUE_1: "ssh://git@github.com/"
      GIT_CONFIG_KEY_2: url.https://github.com/.insteadOf
      GIT_CONFIG_VALUE_2: "git+ssh://git@github.com/"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.git-ref }}

      - name: Check Google Play credentials
        if: inputs.upload-play
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [[ -z "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" ]]; then
            echo "::error::Set GOOGLE_PLAY_SERVICE_ACCOUNT_JSON in repository Actions secrets, or disable upload-play to build the first AAB for manual upload."
            exit 1
          fi

      - name: Set release version code
        run: |
          # A rerun needs a fresh version code, too. The workflow run number
          # remains stable across reruns; run_attempt increases on each retry.
          if (( GITHUB_RUN_ATTEMPT >= 100 )); then
            echo "::error::Start a new workflow run after 99 attempts."
            exit 1
          fi
          echo "LOGSEQ_ANDROID_VERSION_CODE=$((GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT))" >> "$GITHUB_ENV"
          echo "LOGSEQ_ANDROID_REVISION=$(git rev-parse --short=8 HEAD)" >> "$GITHUB_ENV"

      - name: System dependencies
        run: sudo apt-get install -y libsqlite3-dev libffi-dev pkg-config

      - name: Validate Android release wiring
        run: |
          bash scripts/test-android-native-script.sh
          bash scripts/test-no-skip-support.sh
          bash scripts/test-android-e2e-runner.sh
          python3 -m unittest discover -s scripts -p test_android_measurement.py

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Prepare Android signing key
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$ANDROID_KEYSTORE" || -z "$ANDROID_KEYSTORE_PASSWORD" ]]; then
            echo "::error::Configure ANDROID_KEYSTORE (base64) and ANDROID_KEYSTORE_PASSWORD in repository Actions secrets."
            exit 1
          fi
          umask 077
          printf '%s' "$ANDROID_KEYSTORE" | base64 --decode > "$RUNNER_TEMP/android-keystore.jks"
          keytool -list -keystore "$RUNNER_TEMP/android-keystore.jks" \
            -storepass:env ANDROID_KEYSTORE_PASSWORD > /dev/null

      - name: Restore opam root
        id: opam-root
        uses: actions/cache/restore@v4
        with:
          path: ~/.opam
          key: opam-root-${{ runner.os }}-ocaml-5.5

      - name: Restore opam switch
        id: opam-switch
        uses: actions/cache/restore@v4
        with:
          path: _opam
          key: opam-switch-${{ runner.os }}-ocaml-5.5-${{ hashFiles('logseq.opam.locked', 'logseq.opam', '.github/workflows/ci.yml') }}

      # See ci.yml: on a dual cache hit only the opam binary is needed.
      - name: Install opam binary
        if: steps.opam-root.outputs.cache-hit == 'true' && steps.opam-switch.outputs.cache-hit == 'true'
        run: |
          mkdir -p ~/.local/bin
          curl -fsSL https://github.com/ocaml/opam/releases/download/2.6.0/opam-2.6.0-x86_64-linux -o ~/.local/bin/opam
          chmod +x ~/.local/bin/opam
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          eval "$(opam env)"
          opam --version && ocaml -version

      - uses: ocaml/setup-ocaml@v3
        if: steps.opam-root.outputs.cache-hit != 'true' || steps.opam-switch.outputs.cache-hit != 'true'
        with:
          ocaml-compiler: "5.5"
          opam-pin: false

      - name: Save opam root
        if: steps.opam-root.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.opam
          key: opam-root-${{ runner.os }}-ocaml-5.5

      - name: Install opam dependencies
        if: steps.opam-switch.outputs.cache-hit != 'true'
        run: |
          eval "$(opam env)"
          opam pin add -n -y melange-edn-core git+https://github.com/logseq/melange-edn.git#main
          opam pin add -n -y melange-edn-native git+https://github.com/logseq/melange-edn.git#main
          opam pin add -n -y melange-transit-core git+https://github.com/logseq/melange-transit.git#main
          opam pin add -n -y melange-transit-native git+https://github.com/logseq/melange-transit.git#main
          opam install . --deps-only --yes --with-test --assume-depexts
          # Drop installed copies of lockfile-vendored packages (see ci.yml).
          comm -12 \
            <(grep -oE '"[a-zA-Z0-9_.-]+" \{= "[^"]*" & \?vendor\}' logseq.opam.locked | cut -d'"' -f2 | sort) \
            <(opam list --installed --short | sort) \
            | xargs -r opam remove -y
          opam install -y melange.7.0.1-55
          opam install -y opam-monorepo.0.3.6

      - name: Save opam switch
        if: steps.opam-switch.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: _opam
          key: opam-switch-${{ runner.os }}-ocaml-5.5-${{ hashFiles('logseq.opam.locked', 'logseq.opam', '.github/workflows/ci.yml') }}

      # Share ci.yml's duniverse cache key so a CI-populated cache is reused.
      - name: Restore duniverse
        id: duniverse
        uses: actions/cache/restore@v4
        with:
          path: duniverse
          key: duniverse-${{ hashFiles('logseq.opam.locked', 'logseq.opam', '.github/workflows/ci.yml') }}

      - name: Pull vendored dependencies
        if: steps.duniverse.outputs.cache-hit != 'true'
        run: |
          set -e
          eval "$(opam env)"
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global url."https://github.com/".insteadOf "git+ssh://git@github.com/"
          for attempt in 1 2 3; do
            opam exec -- opam-monorepo pull && break
            [ "$attempt" -lt 3 ] || exit 1
            echo "opam-monorepo pull failed (attempt $attempt); retrying" >&2
            sleep 10
          done
          while IFS= read -r pin; do
            url="${pin%%#*}"; sha="${pin##*#}"; name="$(basename "$url" .git)"
            if [ -d "duniverse/$name" ]; then
              continue
            fi
            git clone --quiet "https://github.com/$url" "duniverse/$name"
            if ! git -C "duniverse/$name" checkout --quiet "$sha"; then
              git -C "duniverse/$name" fetch --quiet "https://github.com/$url" "$sha"
              git -C "duniverse/$name" checkout --quiet FETCH_HEAD
            fi
          done < <(grep -oE 'logseq/[A-Za-z0-9_-]+\.git#[A-Za-z0-9._/-]+' logseq.opam | sort -u)

      - name: Save duniverse
        if: steps.duniverse.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: duniverse
          key: duniverse-${{ hashFiles('logseq.opam.locked', 'logseq.opam', '.github/workflows/ci.yml') }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3.2.2
        with:
          packages: platform-tools build-tools;${{ env.ANDROID_BUILD_TOOLS_VERSION }}

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Restore Android OCaml toolchain
        id: android-toolchain
        uses: actions/cache/restore@v4
        with:
          path: |
            _build/android-toolchain
            _build/android-dependency-sources
            _build/android-sqlite-host
          key: android-toolchain-${{ runner.os }}-arm64-v8a-5.5.0-${{ hashFiles('scripts/bootstrap-android-ocaml.sh', 'scripts/build-mobile-libffi.sh') }}

      - name: Restore Android native build cache
        # CMake intermediate objects under .cxx survive source-unchanged
        # rebuilds; the sha key falls back to the previous commit's tree.
        uses: actions/cache/restore@v4
        with:
          path: |
            android/app/.cxx
            android/app/build/intermediates
          key: android-native-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            android-native-${{ runner.os }}-

      - name: Build Android release APK and app bundle
        # assembleRelease depends on buildAndroidNativeCore, which runs
        # scripts/build-android-native.sh for $LOGSEQ_ANDROID_ABI; the Kotlin
        # :lui module resolves to duniverse/lui/platform/android/lui.
        run: |
          eval "$(opam env)"
          LOGSEQ_OPAM_SWITCH="$(opam switch show)"
          DUNE="$(command -v dune)"
          export LOGSEQ_OPAM_SWITCH DUNE
          ./gradlew :app:testReleaseUnitTest :app:compileReleaseAndroidTestKotlin \
            :app:assembleRelease :app:bundleRelease -PlogseqTestBuildType=release
        working-directory: android

      - name: Save Android OCaml toolchain
        if: always() && steps.android-toolchain.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            _build/android-toolchain
            _build/android-dependency-sources
            _build/android-sqlite-host
          key: android-toolchain-${{ runner.os }}-arm64-v8a-5.5.0-${{ hashFiles('scripts/bootstrap-android-ocaml.sh', 'scripts/build-mobile-libffi.sh') }}

      - name: Save Android native build cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            android/app/.cxx
            android/app/build/intermediates
          key: android-native-${{ runner.os }}-${{ github.sha }}

      - name: Sign Android APK and app bundle
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          trap 'rm -f "$RUNNER_TEMP/android-keystore.jks"' EXIT
          build_tools="$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS_VERSION"
          "$build_tools/zipalign" -P 16 -f 4 \
            app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/app-aligned.apk"
          "$build_tools/apksigner" sign \
            --ks "$RUNNER_TEMP/android-keystore.jks" --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --in "$RUNNER_TEMP/app-aligned.apk" \
            --out app-signed.apk
          "$build_tools/apksigner" verify --verbose app-signed.apk
          "$build_tools/zipalign" -c -P 16 4 app-signed.apk

          # apksigner handles APKs; AABs use JAR signing with the same upload key.
          mapfile -t key_aliases < <(
            keytool -J-Duser.language=en -J-Duser.country=US -list -v \
              -keystore "$RUNNER_TEMP/android-keystore.jks" \
              -storepass:env ANDROID_KEYSTORE_PASSWORD \
              | awk '/^Alias name: / { alias = substr($0, 13) } /^Entry type: PrivateKeyEntry$/ { print alias }'
          )
          if (( ${#key_aliases[@]} != 1 )); then
            echo "::error::The Android keystore must contain exactly one private key."
            exit 1
          fi
          jarsigner -keystore "$RUNNER_TEMP/android-keystore.jks" \
            -storepass:env ANDROID_KEYSTORE_PASSWORD -keypass:env ANDROID_KEYSTORE_PASSWORD \
            -signedjar app-signed.aab app/build/outputs/bundle/release/app-release.aab "${key_aliases[0]}"
          jarsigner -verify app-signed.aab
        working-directory: android

      - name: Verify Google Play native library compatibility
        run: python3 scripts/verify-android-release-bundle.py android/app-signed.aab

      - name: Collect release artifacts
        run: |
          mkdir builds
          mv android/app-signed.apk "builds/Logseq-android-${LOGSEQ_ANDROID_REVISION}-${LOGSEQ_ANDROID_VERSION_CODE}.apk"
          mv android/app-signed.aab "builds/Logseq-android-${LOGSEQ_ANDROID_REVISION}-${LOGSEQ_ANDROID_VERSION_CODE}.aab"
          cp android/app/build/outputs/mapping/release/mapping.txt builds/mapping.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: logseq-android-builds
          path: builds
          if-no-files-found: error

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/android-keystore.jks"

  publish-internal:
    if: inputs.upload-play
    needs: build-apk
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: logseq-android-builds
          path: builds

      - name: Publish to Google Play internal testing
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.logseq.logseq
          releaseFiles: builds/*.aab
          track: internal
          status: ${{ inputs.release-status }}
          mappingFile: builds/mapping.txt
