# Builds the Logseq iOS app as a signed .ipa and uploads it to TestFlight via
# fastlane match + the App Store Connect API key. Modeled on logseq/logseq's
# build-ios-release.yml; signing ids and accounts are identical to the mobile
# app in logseq/logseq.

name: Build-iOS

on:
  workflow_dispatch:
    inputs:
      git-ref:
        description: "Release Git Ref (Which branch or tag to build?)"
        required: true
        default: "main"

jobs:
  duniverse:
    name: Vendor duniverse
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    outputs:
      source-revision: ${{ steps.checkout.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        id: checkout
        with:
          ref: ${{ inputs.git-ref }}

      - name: Load OCaml actions from the release workflow revision
        env:
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          # The selected app ref may predate these workflow actions.
          if [[ "$(git rev-parse HEAD)" != "$WORKFLOW_SHA" ]]; then
            git fetch --quiet --no-tags --depth=1 origin "$WORKFLOW_SHA"
            git archive "$WORKFLOW_SHA" .github/actions/ocaml-tools .github/actions/ocaml-vendor | tar -xf -
          fi

      - uses: ./.github/actions/ocaml-vendor
        with:
          mode: prepare

  build-app:
    needs: duniverse
    runs-on: xcode-27
    timeout-minutes: 120
    env:
      LOGSEQ_OPAM_SWITCH: ${{ github.workspace }}
      DUNE_CACHE: enabled
      DUNE_CACHE_STORAGE_MODE: copy
      GIT_TERMINAL_PROMPT: "0"
      GIT_CONFIG_COUNT: 4
      GIT_CONFIG_KEY_0: url.https://github.com/.insteadOf
      GIT_CONFIG_VALUE_0: "git@github.com:"
      GIT_CONFIG_KEY_1: url.https://github.com/.insteadOf
      GIT_CONFIG_VALUE_1: "ssh://git@github.com/"
      GIT_CONFIG_KEY_2: url.https://github.com/.insteadOf
      GIT_CONFIG_VALUE_2: "git+ssh://git@github.com/"
      # Keep the signing repository on SSH for its read-only deploy key.
      GIT_CONFIG_KEY_3: url.ssh://git@github.com/logseq/certificates.git.insteadOf
      GIT_CONFIG_VALUE_3: "ssh://git@github.com/logseq/certificates.git"
    steps:
      - uses: actions/checkout@v4
        id: checkout
        with:
          ref: ${{ needs.duniverse.outputs.source-revision }}

      - name: Load OCaml actions from the release workflow revision
        env:
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          # The selected app ref may predate these workflow actions.
          if [[ "$(git rev-parse HEAD)" != "$WORKFLOW_SHA" ]]; then
            git fetch --quiet --no-tags --depth=1 origin "$WORKFLOW_SHA"
            git archive "$WORKFLOW_SHA" .github/actions/ocaml-tools .github/actions/ocaml-vendor | tar -xf -
          fi

      - name: Prepare signing repository access
        run: |
          set -o pipefail
          : "${IOS_SIGNING_SSH_PRIVATE_KEY:?IOS_SIGNING_SSH_PRIVATE_KEY is required}"
          umask 077
          printf '%s\n' "$IOS_SIGNING_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/logseq-signing-ci"
          mkdir -p "$HOME/.ssh"
          gh api meta --jq '.ssh_keys[] | "github.com " + .' >> "$HOME/.ssh/known_hosts"
          GIT_SSH_COMMAND="ssh -i $RUNNER_TEMP/logseq-signing-ci -o IdentitiesOnly=yes -o BatchMode=yes" \
            git ls-remote ssh://git@github.com/logseq/certificates.git HEAD > /dev/null
        env:
          GH_TOKEN: ${{ github.token }}
          IOS_SIGNING_SSH_PRIVATE_KEY: ${{ secrets.IOS_SIGNING_SSH_PRIVATE_KEY }}

      - name: Select Xcode 27.2
        run: |
          sudo xcode-select --switch /Applications/Xcode_27.2.app
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path

      - name: System dependencies
        run: brew install sdl2 sdl2_ttf

      - name: Install Sentry CLI for release symbols
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          : "${SENTRY_AUTH_TOKEN:?SENTRY_AUTH_TOKEN is required to upload iOS release dSYMs}"
          brew install sentry-cli

      - uses: ./.github/actions/ocaml-tools
        with:
          image: xcode-27

      - uses: ./.github/actions/ocaml-vendor

      - name: Restore iOS OCaml toolchain
        id: ios-toolchain
        uses: actions/cache/restore@v4
        with:
          path: |
            _build/apple-toolchains/ios/host-5.5.0
            _build/apple-toolchains/ios/arm64-apple-ios17.0-5.5.0
            _build/apple-toolchains/ios/libffi-arm64-apple-ios17.0
          key: apple-toolchain-${{ runner.os }}-xcode27.2-ios-device-5.5.0-${{ hashFiles('scripts/bootstrap-ios-ocaml.sh', 'scripts/build-mobile-libffi.sh') }}

      - name: Bootstrap iOS OCaml toolchain (device)
        if: steps.ios-toolchain.outputs.cache-hit != 'true'
        run: ./scripts/bootstrap-ios-ocaml.sh device

      - name: Restore iOS device Dune cache
        id: ios-dune
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/dune
          key: ios-device-dune-v1-${{ runner.arch }}-xcode27.2-${{ steps.checkout.outputs.commit }}
          restore-keys: ios-device-dune-v1-${{ runner.arch }}-xcode27.2-

      - name: Restore Xcode build caches
        uses: actions/cache/restore@v4
        with:
          path: |
            apple/.build
            ~/Library/Developer/Xcode/DerivedData
          key: ios-xcode-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ios-xcode-${{ runner.os }}-

      - name: Build OCaml iOS core (device)
        # Produces _build/ios-core/device/native-link-inputs.txt, which the
        # fastlane beta lane exports as LOGSEQ_NATIVE_LINK_INPUTS so the
        # SwiftPM manifest links the OCaml core into the archive.
        run: opam exec -- env LOGSEQ_IOS_LINK_INPUTS_ONLY=1 ./scripts/build-mobile-ios-device.sh

      - name: Save iOS OCaml toolchain
        # Keep a completed toolchain even if a later compilation failed.
        if: >-
          always() && steps.ios-toolchain.outputs.cache-primary-key != '' &&
          steps.ios-toolchain.outputs.cache-hit != 'true' &&
          hashFiles('_build/apple-toolchains/ios/host-5.5.0/.logseq-toolchain-complete') != '' &&
          hashFiles('_build/apple-toolchains/ios/arm64-apple-ios17.0-5.5.0/.logseq-toolchain-complete') != ''
        uses: actions/cache/save@v4
        with:
          path: |
            _build/apple-toolchains/ios/host-5.5.0
            _build/apple-toolchains/ios/arm64-apple-ios17.0-5.5.0
            _build/apple-toolchains/ios/libffi-arm64-apple-ios17.0
          key: ${{ steps.ios-toolchain.outputs.cache-primary-key }}

      - name: Bound the iOS device Dune cache
        if: steps.ios-dune.outputs.cache-hit != 'true'
        run: opam exec -- dune cache trim --size=512MiB

      - name: Save iOS device Dune cache
        if: steps.ios-dune.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/dune
          key: ${{ steps.ios-dune.outputs.cache-primary-key }}

      - name: Restore bundler gems
        uses: actions/cache/restore@v4
        with:
          path: apple/App/vendor/bundle
          key: bundler-${{ hashFiles('apple/App/Gemfile', 'apple/App/Gemfile.lock', '.github/workflows/build-ios-release.yml') }}

      - name: Setup build tools
        run: |
          sudo gem install bundler -v 2.7.2 --no-document
          bundle _2.7.2_ config set --local path 'vendor/bundle'
          bundle _2.7.2_ install
        working-directory: ./apple/App

      - name: Save bundler gems
        uses: actions/cache/save@v4
        with:
          path: apple/App/vendor/bundle
          key: bundler-${{ hashFiles('apple/App/Gemfile', 'apple/App/Gemfile.lock', '.github/workflows/build-ios-release.yml') }}

      - name: Build and upload iOS app
        run: |
          # Xcode's system rsync must also resolve its child process to the
          # system version, rather than an incompatible Homebrew rsync.
          mkdir -p "$RUNNER_TEMP/apple-export-tools"
          ln -s /usr/bin/rsync "$RUNNER_TEMP/apple-export-tools/rsync"
          export PATH="$RUNNER_TEMP/apple-export-tools:$PATH"
          df -h .
          bundle exec fastlane beta
        working-directory: ./apple/App
        env:
          APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY }}
          APP_STORE_CONNECT_API_KEY_IS_KEY_CONTENT_BASE64: true
          SLACK_URL: ${{ secrets.SLACK_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_URL: ssh://git@github.com/logseq/certificates.git
          MATCH_GIT_PRIVATE_KEY: ${{ runner.temp }}/logseq-signing-ci
          XCODE_XCARGS: "-allowProvisioningUpdates"

      - name: Collect iOS export diagnostics
        if: always()
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import shutil
          root = Path("_build/ios-release/diagnostics")
          root.mkdir(parents=True, exist_ok=True)
          for source in Path(os.environ["TMPDIR"]).glob("*.xcdistributionlogs"):
              shutil.copytree(source, root / source.name, dirs_exist_ok=True)
          logs = Path.home() / "Library/Logs/gym"
          if logs.exists():
              shutil.copytree(logs, root / "gym", dirs_exist_ok=True)
          for path in root.rglob("IDEDistributionPipeline.log"):
              lines = path.read_text(errors="replace").splitlines()
              failures = [line for line in lines if any(word in line.lower() for word in ("rsync", "error:", "failed"))]
              for line in failures[-30:]:
                  print(line)
          PY
          df -h .

      - name: Save iOS verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-verification-${{ github.run_id }}
          path: _build/ios-release/*verification.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Save verified iOS release and diagnostics
        if: always() && github.event.repository.private
        uses: actions/upload-artifact@v4
        with:
          name: ios-release-${{ github.run_id }}
          path: |
            _build/ios-release/*.ipa
            _build/ios-release/*verification.json
            _build/ios-release/diagnostics
          retention-days: 7

      - name: Save Xcode build caches
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            apple/.build
            ~/Library/Developer/Xcode/DerivedData
          key: ios-xcode-${{ runner.os }}-${{ github.sha }}
