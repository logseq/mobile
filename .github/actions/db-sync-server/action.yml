name: Start db-sync server
description: >-
  Restore or build the db-sync Node server for the native-compatible Logseq
  revision and start it on the given port (default 8787).
inputs:
  ref:
    description: logseq/logseq ref to check out.
    required: false
    # This revision includes the snapshot transaction cursor required by the
    # shared native bootstrap protocol. The old feature branch omitted it.
    default: a63da5cb7993302f8c58ccf42eaf0083b77cf42b
  port:
    description: Port the server binds.
    required: false
    default: "8787"
  background:
    description: >-
      When "true", any required build and the server start run in
      a detached background process (log at logseq-server/deps/db-sync/build.log)
      so the job can continue with other work; a later step must poll the port.
    required: false
    default: "false"
outputs:
  port:
    description: The port the server is listening on.
    value: ${{ inputs.port }}
  cache-hit:
    description: Whether the exact runtime was restored.
    value: ${{ steps.runtime.outputs.cache-hit }}
  cache-key:
    description: Key for saving a newly prepared runtime after startup.
    value: ${{ steps.runtime.outputs.cache-primary-key }}
runs:
  using: composite
  steps:
    - name: Check out db-sync server
      id: server
      uses: actions/checkout@v4
      with:
        repository: logseq/logseq
        ref: ${{ inputs.ref }}
        path: logseq-server
        fetch-depth: 1

    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: "21"

    - uses: actions/setup-node@v4
      with:
        node-version: "22"

    - name: Read Node ABI
      id: node
      shell: bash
      run: echo "abi=$(node -p process.versions.modules)" >> "$GITHUB_OUTPUT"

    - name: Cache db-sync runtime
      # better-sqlite3 ships a native binding tied to the platform and Node ABI.
      id: runtime
      uses: actions/cache/restore@v4
      with:
        path: ${{ runner.temp }}/db-sync-runtime
        key: db-sync-runtime-v1-${{ runner.os }}-${{ runner.arch }}-node${{ steps.node.outputs.abi }}-${{ steps.server.outputs.commit }}-${{ hashFiles('.github/actions/db-sync-server/run.sh') }}

    - name: Start db-sync
      shell: bash
      env:
        DB_SYNC_PORT: ${{ inputs.port }}
        DB_SYNC_BACKGROUND: ${{ inputs.background }}
      run: |
        cd "$GITHUB_WORKSPACE/logseq-server/deps/db-sync"
        if [[ $DB_SYNC_BACKGROUND == true ]]; then
          nohup bash "$GITHUB_ACTION_PATH/run.sh" >"$PWD/build.log" 2>&1 &
          echo "db-sync startup running in background (pid $!)"
          exit 0
        fi
        bash "$GITHUB_ACTION_PATH/run.sh"
        for attempt in $(seq 1 90); do
          # Any HTTP response (including 401/404) means the port is bound.
          if curl -s -o /dev/null "http://127.0.0.1:$DB_SYNC_PORT/"; then
            echo "db-sync is listening on :$DB_SYNC_PORT"
            exit 0
          fi
          sleep 2
        done
        echo "db-sync did not start; tail of log:" >&2
        tail -100 "$PWD/db-sync.log" >&2 || true
        exit 1

    - name: Upload db-sync log
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: db-sync-log-${{ runner.os }}
        path: logseq-server/deps/db-sync/db-sync.log
        retention-days: 7
        if-no-files-found: ignore
