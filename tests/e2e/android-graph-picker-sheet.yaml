appId: com.logseq.logseq
---
- launchApp
- extendedWaitUntil:
    visible:
      id: "screen.graph-picker"
    timeout: 30000
- tapOn:
    id: "button.graph-add"
- extendedWaitUntil:
    visible:
      id: "form.graph-create"
    timeout: 5000
- assertVisible:
    id: "field.graph-name"
- assertVisible:
    id: "toggle.graph-encryption"
- assertVisible:
    id: "button.graph-add.confirm"
    enabled: false
- takeScreenshot: tests/e2e/screenshots/android-graph-create-sheet
- tapOn:
    id: "field.graph-name"
- inputText: "Android E2E Draft"
- assertVisible:
    id: "button.graph-add.confirm"
    enabled: true
- hideKeyboard
- tapOn:
    id: "button.graph-add.cancel"
- assertVisible:
    id: "screen.graph-picker"
