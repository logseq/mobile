appId: com.logseq.logseq
---
- launchApp
- extendedWaitUntil:
    visible:
      id: "button.composer.expand"
    timeout: 30000
- tapOn:
    id: "button.search"
- assertVisible:
    id: "screen.search"
- tapOn: "close"
- extendedWaitUntil:
    visible:
      id: "button.composer.expand"
    timeout: 10000
