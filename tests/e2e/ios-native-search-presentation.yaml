appId: com.logseq.logseq
---
- launchApp
- extendedWaitUntil:
    visible:
      id: "button.composer.expand"
    timeout: 30000
- tapOn:
    id: "button.search"
- assertVisible: "Search pages and blocks"
- tapOn:
    id: "button.search.close"
- extendedWaitUntil:
    visible:
      id: "button.composer.expand"
    timeout: 10000
