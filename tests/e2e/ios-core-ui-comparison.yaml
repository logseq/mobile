appId: com.logseq.logseq
---
- launchApp
- extendedWaitUntil:
    visible:
      id: "button.sidebar"
    timeout: 30000
- assertVisible: "Journals"
- takeScreenshot: "tests/e2e/screenshots/ios-journals"
- tapOn:
    id: "button.sidebar"
- assertVisible:
    id: "sidebar.navigation"
- takeScreenshot: "tests/e2e/screenshots/ios-sidebar"
- tapOn:
    id: "button.sidebar.dismiss"
- scrollUntilVisible:
    element: "Open Aug 24th, 2026"
    direction: DOWN
    timeout: 30000
    visibilityPercentage: 50
    centerElement: true
- tapOn: "Open Aug 24th, 2026"
- assertVisible:
    id: "BackButton"
- takeScreenshot: "tests/e2e/screenshots/ios-node"
