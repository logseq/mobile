appId: com.logseq.app
---
- launchApp
- runFlow:
    when:
      visible:
        id: "button.hosted-sign-in"
    commands:
      - tapOn:
          id: "button.hosted-sign-in"
      - runFlow:
          when:
            visible: "Use without an account"
          commands:
            - tapOn: "Use without an account"
      - extendedWaitUntil:
          visible:
            id: "signInFormUsername|screen.graph-picker|button.composer.expand"
          timeout: 30000
      # A retained browser session can complete sign-in without the form.
      - runFlow:
          when:
            visible:
              id: "signInFormUsername"
          commands:
            - tapOn:
                id: "signInFormUsername"
            - inputText: ${USERNAME}
            - runFlow:
                when:
                  visible: "Try out your stylus"
                commands:
                  - tapOn: "Cancel"
            - tapOn:
                id: "signInFormPassword"
            - inputText: ${PASSWORD}
            - hideKeyboard
            - extendedWaitUntil:
                visible: "submit"
                timeout: 10000
            - tapOn: "submit"
            - extendedWaitUntil:
                visible:
                  id: "screen.graph-picker|button.composer.expand"
                timeout: 60000
- runFlow:
    when:
      visible:
        id: "screen.graph-picker"
    commands:
      - tapOn:
          id: "button.graph-add"
      - extendedWaitUntil:
          visible:
            # Login can finish opening the bootstrap graph after the picker
            # was observed. Wait for either stable outcome of that transition.
            id: "field.graph-name|button.composer.expand"
          timeout: 30000
- runFlow:
    when:
      visible:
        id: "field.graph-name"
    commands:
      - tapOn:
          id: "field.graph-name"
      - inputText: "android-e2e-smoke"
      - hideKeyboard
      - tapOn:
          id: "toggle.graph-encryption"
      - assertVisible:
          id: "toggle.graph-encryption"
          checked: false
      - tapOn:
          id: "button.graph-add.confirm"
      - extendedWaitUntil:
          visible:
            id: "button.composer.expand"
          timeout: 60000
- extendedWaitUntil:
    visible:
      id: "button.composer.expand"
    timeout: 60000
