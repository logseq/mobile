appId: com.logseq.app
---
- launchApp
- runFlow:
    when:
      visible:
        id: "button.sign-in"
    commands:
      - tapOn:
          id: "button.sign-in"
      - extendedWaitUntil:
          visible:
            id: "field.auth.email"
          timeout: 10000
      - tapOn:
          id: "field.auth.email"
      - inputText: ${USERNAME}
      - tapOn:
          id: "field.auth.password"
      - inputText: ${PASSWORD}
      - hideKeyboard
      - tapOn:
          id: "button.auth.submit"
      - extendedWaitUntil:
          visible:
            id: "screen.graph-picker|button.composer.expand"
          timeout: 60000
- runFlow:
    when:
      visible:
        id: "screen.graph-picker"
    commands:
      - tapOn:
          id: "button.graph-add"
      - extendedWaitUntil:
          visible:
            # Login can finish opening the bootstrap graph after the picker
            # was observed. Wait for either stable outcome of that transition.
            id: "field.graph-name|button.composer.expand"
          timeout: 30000
- runFlow:
    when:
      visible:
        id: "field.graph-name"
    commands:
      - tapOn:
          id: "field.graph-name"
      - inputText: "android-e2e-smoke"
      - hideKeyboard
      - tapOn:
          id: "toggle.graph-encryption"
      - assertVisible:
          id: "toggle.graph-encryption"
          checked: false
      - tapOn:
          id: "button.graph-add.confirm"
      - extendedWaitUntil:
          visible:
            id: "button.composer.expand"
          timeout: 60000
- extendedWaitUntil:
    visible:
      id: "button.composer.expand"
    timeout: 60000
