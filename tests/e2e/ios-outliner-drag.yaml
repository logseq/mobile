appId: com.logseq.logseq
---
- runFlow:
    file: "__LOGSEQ_E2E_SETUP_FLOW__"
- launchApp
- runFlow:
    file: "__LOGSEQ_E2E_OUTLINER_ANCHOR_FLOW__"
- assertVisible:
    id: "pane.journals"
- longPressOn: "E2E anchor A __LOGSEQ_E2E_RUN_ID__"
- assertVisible: "Copy"
- tapOn:
    point: "3%,50%"
- assertNotVisible: "Copy"
