appId: com.logseq.logseq
---
- runFlow:
    file: "__LOGSEQ_E2E_SETUP_FLOW__"
- launchApp
- extendedWaitUntil:
    visible:
      id: "button.sidebar"
    timeout: 30000
- tapOn:
    id: "button.sidebar"
- tapOn:
    id: "link.sidebar.graphs"
- assertVisible:
    id: "screen.graphs"
- assertVisible:
    id: "button.sidebar"
- assertNotVisible:
    id: "BackButton"
- tapOn:
    id: "button.graphs.refresh"
- assertVisible: "Local graphs"
- longPressOn: "logseq-local-e2e-fixture"
- tapOn: "Delete local graph"
- assertVisible:
    id: button.graph-delete.cancel
- assertVisible:
    id: button.graph-delete.confirm
- tapOn:
    id: button.graph-delete.cancel
- assertVisible:
    id: "screen.graphs"
- longPressOn: "logseq-local-e2e-fixture"
- tapOn: "Delete local graph"
- assertVisible:
    id: button.graph-delete.confirm
- swipe:
    from:
      text: "Delete local graph"
    direction: DOWN
    duration: 500
- assertNotVisible:
    id: button.graph-delete.confirm
- assertVisible: "logseq-local-e2e-fixture"
# The local-only context action still exists after Cancel and swipe dismissal.
- longPressOn: "logseq-local-e2e-fixture"
- tapOn: "Delete local graph"
- tapOn:
    id: button.graph-delete.confirm
- extendedWaitUntil:
    notVisible:
      id: button.graph-delete.confirm
    timeout: 15000
- assertVisible: "Remote graphs"
- longPressOn: "logseq-local-e2e-fixture"
- assertNotVisible: "Delete local graph"
- tapOn: "logseq-local-e2e-fixture"
- extendedWaitUntil:
    visible:
      id: "journals.graph-loaded"
    timeout: 60000
- assertNotVisible:
    id: "screen.graphs"
