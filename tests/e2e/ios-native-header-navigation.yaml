appId: com.logseq.logseq
---
- runFlow:
    file: "__LOGSEQ_E2E_SETUP_FLOW__"
- launchApp
- assertVisible:
    id: "pane.journals"
- assertVisible:
    id: "title.main"
- assertNotVisible:
    id: "BackButton"
- assertVisible:
    id: "button.sidebar"
- tapOn:
    id: "button.search"
- assertVisible:
    id: "screen.search"
- inputText: "Aug 24th, 2026"
- pressKey: Enter
- tapOn:
    id: "search.result.e2e00000-0000-4000-8000-000000000030"
- assertVisible: "Aug 24th, 2026"
- assertVisible:
    id: "BackButton"
- takeScreenshot: "ios-native-header-node"
- tapOn:
    id: "BackButton"
- assertVisible:
    id: "screen.search"
- tapOn: "close"
- assertVisible:
    id: "pane.journals"
- assertVisible:
    id: "title.main"
- assertNotVisible:
    id: "BackButton"
- assertVisible:
    id: "button.sidebar"
- takeScreenshot: "ios-native-header-journal"
