appId: com.logseq.app
---
- launchApp
- tapOn:
    id: "button.sign-in"
- extendedWaitUntil:
    visible:
      id: "field.auth.email"
    timeout: 10000
- tapOn:
    id: "field.auth.email"
- inputText: ${USERNAME}
- tapOn:
    id: "field.auth.password"
- inputText: ${PASSWORD}
- hideKeyboard
- tapOn:
    id: "button.auth.submit"
- extendedWaitUntil:
    visible:
      id: "screen.graph-picker|button.composer.expand"
    timeout: 60000
- runFlow:
    file: "android-graph-picker-sheet.yaml"
- runFlow:
    file: "android-graph-picker-settings.yaml"
- runFlow:
    when:
      notVisible:
        id: "graph\\..*"
    commands:
      - tapOn:
          id: "button.graph-add"
      - extendedWaitUntil:
          visible:
            id: "form.graph-create"
          timeout: 10000
      - tapOn:
          id: "field.graph-name"
      - inputText: "android-e2e-graph"
      - hideKeyboard
      - tapOn:
          id: "toggle.graph-encryption"
      - tapOn:
          id: "button.graph-add.confirm"
- runFlow:
    when:
      visible:
        id: "graph\\..*"
    commands:
      - runFlow:
          file: "android-graph-picker-open.yaml"
- extendedWaitUntil:
    visible:
      id: "button.composer.expand"
    timeout: 60000
- extendedWaitUntil:
    visible:
      id: "button.connection"
    timeout: 30000
- tapOn:
    id: "button.connection"
- tapOn: "Settings"
- assertVisible:
    id: "sheet.settings"
- assertVisible:
    id: "button.connection.apply"
- tapOn:
    id: "button.connection.apply"
- assertVisible:
    id: "button.composer.expand"
