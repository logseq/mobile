appId: com.logseq.logseq
---
- runFlow:
    file: "__LOGSEQ_E2E_SETUP_FLOW__"
- extendedWaitUntil:
    visible:
      id: "button.composer.expand"
    timeout: 30000
- tapOn:
    id: "button.composer.expand"
- tapOn:
    id: "button.task-status"
- tapOn: "Todo"
- tapOn:
    id: "field.composer"
- inputText: "Search task __LOGSEQ_E2E_RUN_ID__"
- tapOn:
    id: "button.send"
- tapOn:
    id: "surface.composer.dismiss"
- assertVisible:
    id: "button.composer.expand"
- scrollUntilVisible:
    element:
      id: "outliner.block-action.*"
      text: "Edit block Search task __LOGSEQ_E2E_RUN_ID__"
    direction: DOWN
    timeout: 30000
    speed: 50
    visibilityPercentage: 50
    centerElement: true
- assertVisible:
    id: "outliner.block-action.*"
    text: "Edit block Search task __LOGSEQ_E2E_RUN_ID__"
- assertVisible:
    id: "button.block-task-status"
- tapOn:
    id: "button.search"
- assertVisible:
    id: "screen.search"
- assertVisible:
    text: "close"
- assertNotVisible: "Cancel"
- assertNotVisible:
    id: "BackButton"
- extendedWaitUntil:
    visible:
      id: "field.native-search"
    timeout: 10000
- inputText: "x"
- eraseText: 1
- inputText: "Search task __LOGSEQ_E2E_RUN_ID__"
- assertVisible:
    id: "field.native-search"
    text: "Search task __LOGSEQ_E2E_RUN_ID__"
- pressKey: Enter
- extendedWaitUntil:
    visible:
      id: "search.result.*"
    timeout: 10000
- swipe:
    direction: UP
    duration: 400
- assertVisible: "Search task __LOGSEQ_E2E_RUN_ID__"
- tapOn:
    id: "search.result.*"
- extendedWaitUntil:
    visible:
      id: "BackButton"
    timeout: 10000
- tapOn:
    id: "BackButton"
- extendedWaitUntil:
    visible:
      id: "screen.search"
    timeout: 10000
- assertVisible: "Search task __LOGSEQ_E2E_RUN_ID__"
- tapOn: "close"
- assertNotVisible:
    id: "screen.search"
- extendedWaitUntil:
    visible:
      id: "button.composer.expand"
    timeout: 10000
- assertVisible:
    id: "outliner.block-action.*"
    text: "Edit block Search task __LOGSEQ_E2E_RUN_ID__"
- assertVisible:
    id: "button.block-task-status"
- takeScreenshot: "ios-search-status-regression"
