appId: com.logseq.logseq
---
- launchApp
- extendedWaitUntil:
    visible:
      id: "button.sidebar"
    timeout: 60000
- tapOn:
    id: "button.sidebar"
- tapOn:
    id: "link.sidebar.graphs"
- tapOn:
    id: "button.graphs.refresh"
- extendedWaitUntil:
    visible:
      id: "screen.graphs"
    timeout: 15000
- extendedWaitUntil:
    notVisible:
      id: "graphs.loading"
    timeout: 15000
- runFlow:
    when:
      notVisible: "logseq-local-e2e-fixture"
    commands:
      - tapOn:
          id: "button.graph-add"
      - extendedWaitUntil:
          visible: "Add sync graph"
          timeout: 10000
      - tapOn:
          id: "field.graph-name"
      - inputText: "logseq-local-e2e-fixture"
      - tapOn:
          id: "button.graph-add.confirm"
      - extendedWaitUntil:
          notVisible:
            id: "screen.graphs"
          timeout: 60000
- runFlow:
    when:
      visible:
        text: "logseq-local-e2e-fixture"
        below: "Local graphs|Remote graphs"
    commands:
      - tapOn:
          text: "logseq-local-e2e-fixture"
          below: "Local graphs|Remote graphs"
- extendedWaitUntil:
    notVisible:
      id: "screen.graphs"
    timeout: 60000
- assertVisible:
    id: "button.composer.expand"
- stopApp
