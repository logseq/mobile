appId: com.logseq.logseq
---
- launchApp
- runFlow:
    when:
      visible:
        id: "button.sign-in"
    commands:
      - tapOn:
          id: "button.sign-in"
      - extendedWaitUntil:
          visible:
            id: "field.auth.email"
          timeout: 10000
      - tapOn:
          id: "field.auth.email"
      - inputText: "__LOGSEQ_E2E_USERNAME__"
      - tapOn:
          id: "field.auth.password"
      - inputText: "__LOGSEQ_E2E_PASSWORD__"
      - pressKey: ENTER
      - tapOn:
          text: "Not Now"
          optional: true
      - extendedWaitUntil:
          visible:
            id: "button.graph-add|button.composer.expand"
          timeout: 60000
- extendedWaitUntil:
    visible:
      id: "button.graph-add"
    timeout: 30000
- tapOn: "__LOGSEQ_E2E_GRAPH_NAME__"
- extendedWaitUntil:
    visible:
      id: "sync.connected"
    timeout: 30000
- scrollUntilVisible:
    element:
      id: "outliner.block-action.*"
      text: "Edit block __LOGSEQ_E2E_DESKTOP_BLOCK__"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "sync.connected"
- copyTextFrom:
    id: "sync.cursor"
- evalScript: ${output.cursorBefore = Number(maestro.copiedText)}
- tapOn:
    id: "button.sync.done"
- tapOn:
    id: "button.composer.expand"
- tapOn:
    id: "field.composer"
- inputText: "__LOGSEQ_E2E_MOBILE_BLOCK__"
- tapOn:
    id: "button.send"
- tapOn:
    id: "surface.composer.dismiss"
- tapOn:
    id: "sync.connected"
- extendedWaitUntil:
    visible:
      id: "sync.pending"
      text: "Saved"
    timeout: 30000
- copyTextFrom:
    id: "sync.cursor"
- assertTrue: ${Number(maestro.copiedText) > output.cursorBefore}
- tapOn:
    id: "button.sync.done"
- assertVisible:
    id: "outliner.block-action.*"
    text: "Edit block __LOGSEQ_E2E_MOBILE_BLOCK__"
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: "outliner.block-action.*"
      text: "Edit block __LOGSEQ_E2E_DESKTOP_BLOCK__"
    timeout: 30000
- assertVisible:
    id: "outliner.block-action.*"
    text: "Edit block __LOGSEQ_E2E_MOBILE_BLOCK__"
- assertVisible:
    id: "sync.connected"
