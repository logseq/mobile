appId: com.logseq.logseq
---
- launchApp:
    clearState: true
- runFlow:
    when:
      visible:
        id: "button.sign-in"
    commands:
      - tapOn:
          id: "button.sign-in"
      - extendedWaitUntil:
          visible:
            id: "field.auth.email"
          timeout: 10000
      - tapOn:
          id: "field.auth.email"
      - inputText: "__LOGSEQ_E2E_USERNAME__"
      - tapOn:
          id: "field.auth.password"
      - inputText: "__LOGSEQ_E2E_PASSWORD__"
      - scrollUntilVisible:
          element:
            id: "button.auth.submit"
            enabled: true
          direction: DOWN
          timeout: 10000
      - tapOn:
          id: "button.auth.submit"
      - extendedWaitUntil:
          visible:
            id: "screen.graph-picker|button.composer.expand"
          timeout: 60000
- extendedWaitUntil:
    visible:
      id: "screen.graph-picker"
    timeout: 30000
- tapOn: "__LOGSEQ_E2E_GRAPH_NAME__"
- extendedWaitUntil:
    visible:
      id: "sync.connected"
    timeout: 30000
- scrollUntilVisible:
    element:
      text: "__LOGSEQ_E2E_DESKTOP_BLOCK__"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "button.composer.expand"
- tapOn:
    id: "field.composer"
- inputText: "__LOGSEQ_E2E_MOBILE_BLOCK__"
- tapOn:
    id: "button.send"
- extendedWaitUntil:
    visible:
      id: "sync.cursor-advanced"
    timeout: 30000
- assertVisible: "__LOGSEQ_E2E_MOBILE_BLOCK__"
- stopApp
- launchApp
- extendedWaitUntil:
    visible: "__LOGSEQ_E2E_DESKTOP_BLOCK__"
    timeout: 30000
- assertVisible: "__LOGSEQ_E2E_MOBILE_BLOCK__"
- assertVisible:
    id: "sync.connected"
