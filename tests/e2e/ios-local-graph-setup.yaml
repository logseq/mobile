appId: com.logseq.logseq
---
- launchApp
- runFlow:
    when:
      visible:
        id: "button.sign-in"
    commands:
      - tapOn:
          id: "button.sign-in"
      - extendedWaitUntil:
          visible:
            id: "field.auth.email"
          timeout: 10000
      - tapOn:
          id: "field.auth.email"
      - inputText: "__LOGSEQ_E2E_USERNAME__"
      - tapOn:
          id: "field.auth.password"
      - inputText: "__LOGSEQ_E2E_PASSWORD__"
      - scrollUntilVisible:
          element:
            id: "button.auth.submit"
            enabled: true
          direction: DOWN
          timeout: 10000
      - tapOn:
          id: "button.auth.submit"
      - extendedWaitUntil:
          visible:
            id: "screen.graph-picker|button.composer.expand"
          timeout: 60000
- runFlow:
    when:
      visible: "__LOGSEQ_E2E_GRAPH_NAME__"
    commands:
      - tapOn: "__LOGSEQ_E2E_GRAPH_NAME__"
- runFlow:
    when:
      visible: "Choose a graph"
    commands:
      - extendedWaitUntil:
          visible: "Choose a graph"
          timeout: 30000
      - tapOn: "Add sync graph"
      - extendedWaitUntil:
          visible: "Add sync graph"
          timeout: 10000
      - tapOn:
          id: "field.graph-name"
      - inputText: "__LOGSEQ_E2E_GRAPH_NAME__"
      - tapOn:
          id: "toggle.graph-encryption"
          point: "90%,50%"
      - assertVisible:
          id: "toggle.graph-encryption"
          checked: false
      - tapOn:
          id: "button.graph-add.confirm"
- extendedWaitUntil:
    visible:
      id: "button.sidebar"
    timeout: 60000
