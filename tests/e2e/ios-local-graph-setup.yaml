appId: com.logseq.logseq
---
- launchApp
- runFlow:
    when:
      visible:
        id: "button.hosted-sign-in"
    commands:
      - tapOn:
          id: "button.hosted-sign-in"
      - runFlow:
          when:
            visible: "Use without an account"
          commands:
            - tapOn: "Use without an account"
      - extendedWaitUntil:
          visible: "Sign in with your username and password"
          timeout: 30000
      - tapOn: "Username Username"
      - inputText: "__LOGSEQ_E2E_USERNAME__"
      - pressKey: Enter
      - inputText: "__LOGSEQ_E2E_PASSWORD__"
      - tapOn: "Sign in with your username and password"
      - extendedWaitUntil:
          visible: "submit"
          timeout: 10000
      - tapOn: "submit"
      # Post-login bootstrap churns the view tree; hierarchy snapshots taken
      # during it have stalled the XCTest driver on CI. Wait it out.
      - waitForAnimationToEnd:
          timeout: 30000
      # Restart from the stored session instead of querying the transient
      # post-login tree, which can crash the XCTest hierarchy driver.
      - stopApp
      # Do not snapshot the completed hosted browser session after relaunch.
      - stopApp: com.apple.SafariViewService
      - launchApp
- runFlow:
    when:
      visible: "__LOGSEQ_E2E_GRAPH_NAME__"
    commands:
      - tapOn: "__LOGSEQ_E2E_GRAPH_NAME__"
- runFlow:
    when:
      visible: "Choose a graph"
    commands:
      - extendedWaitUntil:
          visible: "Choose a graph"
          timeout: 30000
      - tapOn: "Add sync graph"
      - extendedWaitUntil:
          visible: "Add sync graph"
          timeout: 10000
      - tapOn:
          id: "field.graph-name"
      - inputText: "__LOGSEQ_E2E_GRAPH_NAME__"
      - tapOn:
          id: "toggle.graph-encryption"
          point: "90%,50%"
      - assertVisible:
          id: "toggle.graph-encryption"
          checked: false
      - tapOn:
          id: "button.graph-add.confirm"
- extendedWaitUntil:
    visible:
      id: "button.sidebar"
    timeout: 60000
