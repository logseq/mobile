appId: com.logseq.logseq
---
- launchApp
- runFlow:
    when:
      visible:
        id: "button.hosted-sign-in"
    commands:
      - tapOn:
          id: "button.hosted-sign-in"
      - runFlow:
          when:
            visible: "Use without an account"
          commands:
            - tapOn: "Use without an account"
      - extendedWaitUntil:
          visible: "Sign in with your username and password"
          timeout: 30000
      - tapOn: "Username Username"
      - inputText: "__LOGSEQ_E2E_USERNAME__"
      - pressKey: Enter
      - inputText: "__LOGSEQ_E2E_PASSWORD__"
      - tapOn: "Sign in with your username and password"
      - extendedWaitUntil:
          visible: "submit"
          timeout: 10000
      - tapOn: "submit"
      # Post-login bootstrap churns the view tree; hierarchy snapshots taken
      # during it have stalled the XCTest driver on CI. Wait it out.
      - waitForAnimationToEnd:
          timeout: 30000
- runFlow:
    when:
      visible: "Enter your username"
    commands:
      - tapOn: "Enter your username"
      - inputText: "__LOGSEQ_E2E_USERNAME__"
      - tapOn: "Enter your password"
      - inputText: "__LOGSEQ_E2E_PASSWORD__"
      - tapOn:
          text: "Sign In"
          index: 1
- runFlow:
    when:
      visible: "__LOGSEQ_E2E_GRAPH_NAME__"
    commands:
      - tapOn: "__LOGSEQ_E2E_GRAPH_NAME__"
- waitForAnimationToEnd:
    timeout: 5000
- extendedWaitUntil:
    visible:
      id: "button.sidebar"
    timeout: 20000
    optional: true
- runFlow:
    when:
      notVisible:
        id: "button.sidebar"
    commands:
      - extendedWaitUntil:
          visible: "Choose a graph"
          timeout: 30000
      - tapOn: "Add sync graph"
      - extendedWaitUntil:
          visible: "Add sync graph"
          timeout: 10000
      - tapOn:
          id: "field.graph-name"
      - inputText: "__LOGSEQ_E2E_GRAPH_NAME__"
      - tapOn:
          id: "toggle.graph-encryption"
          point: "90%,50%"
      - assertVisible:
          id: "toggle.graph-encryption"
          checked: false
      - tapOn:
          id: "button.graph-add.confirm"
- runFlow:
    when:
      visible: "Unlock encrypted graphs"
    commands:
      - tapOn: "E2EE password"
      - inputText: "__LOGSEQ_E2EE_PASSWORD__"
      - tapOn: "Unlock"
- extendedWaitUntil:
    visible:
      id: "button.sidebar"
    timeout: 60000
