appId: com.logseq.logseq
---
- launchApp
- extendedWaitUntil:
    visible:
      id: "button.search"
    timeout: 30000
- tapOn:
    id: "button.search"
- assertVisible:
    id: "screen.search"
- extendedWaitUntil:
    visible:
      id: "field.native-search"
    timeout: 10000
- inputText: "Aug 16th, 2026"
- assertVisible:
    id: "field.native-search"
    text: "Aug 16th, 2026"
- extendedWaitUntil:
    visible:
      id: "search.result.title.e2e10000-0000-4000-8000-000000000007"
      text: "Aug 16th, 2026"
    timeout: 10000
- tapOn:
    id: "search.result.e2e10000-0000-4000-8000-000000000007"
- extendedWaitUntil:
    visible:
      id: "outliner.block-action.e2e20000-0000-4000-8000-000000000007"
      text: "Edit block E2E Block Target"
    timeout: 10000
- assertVisible:
    id: "title.node"
    text: "Aug 16th, 2026"
- tapOn:
    id: "BackButton"
- assertVisible:
    id: "screen.search"
- assertVisible:
    id: "search.result.e2e10000-0000-4000-8000-000000000007"
- assertVisible:
    id: "search.result.title.e2e10000-0000-4000-8000-000000000007"
    text: "Aug 16th, 2026"
- tapOn: "close"
- assertVisible:
    id: "button.search"
