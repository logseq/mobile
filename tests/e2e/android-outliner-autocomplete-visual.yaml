appId: com.logseq.logseq
---
- launchApp
- extendedWaitUntil:
    visible: "E2E Outliner Fixture"
    timeout: 30000
- tapOn: "Edit block E2E Outliner Fixture"
- assertVisible:
    id: "toolbar.outliner.editor"
- tapOn:
    id: "button.outliner.editor.tag"
- extendedWaitUntil:
    visible:
      id: "toolbar.outliner.autocomplete"
    timeout: 10000
- assertVisible:
    id: "button.outliner.autocomplete.0"
- takeScreenshot: tests/e2e/screenshots/android-autocomplete-current
