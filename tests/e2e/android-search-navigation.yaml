appId: com.logseq.logseq
---
- launchApp
- extendedWaitUntil:
    visible:
      id: "button.search"
    timeout: 45000
- tapOn:
    id: "button.search"
- assertVisible:
    id: "screen.search"
- tapOn:
    id: "field.search"
- inputText: "Aug 16th, 2026"
- extendedWaitUntil:
    visible:
      id: "screen.search.results"
    timeout: 10000
- assertVisible: "Aug 16th, 2026"
- tapOn:
    id: "search.result.e2e10000-0000-4000-8000-000000000007"
- extendedWaitUntil:
    visible:
      id: "screen.node"
    timeout: 10000
- assertVisible: "E2E Block Target"
- pressKey: BACK
- assertVisible:
    id: "screen.search"
- assertVisible: "Aug 16th, 2026"
- hideKeyboard
- pressKey: BACK
- assertVisible:
    id: "button.search"
