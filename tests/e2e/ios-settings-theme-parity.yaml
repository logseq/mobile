appId: com.logseq.logseq
---
- runFlow: __LOGSEQ_E2E_SETUP_FLOW__
- extendedWaitUntil:
    visible:
      id: "button.sidebar"
    timeout: 60000
- tapOn:
    id: "button.sidebar"
- tapOn:
    id: "button.sidebar.settings"
- assertVisible:
    id: "screen.settings"
- tapOn:
    id: "link.settings.general"
- assertVisible: "Theme"
- assertVisible: "Language"
- tapOn:
    id: "picker.settings.language"
    point: "90%,50%"
- scrollUntilVisible:
    element:
      text: "العربية"
    direction: DOWN
- tapOn: "العربية"
- tapOn:
    id: "picker.settings.language"
    point: "90%,50%"
- scrollUntilVisible:
    element:
      text: "System"
    direction: UP
- tapOn: "System"
- tapOn:
    id: "button.connection.cancel"
- tapOn:
    id: "link.settings.editor"
- assertVisible: "Spell check"
- assertVisible: "Auto-correction"
- tapOn:
    id: "button.connection.cancel"
- tapOn:
    id: "link.settings.sync-server"
- assertVisible: "Sync server"
- assertVisible:
    id: "field.base-url"
- tapOn:
    id: "button.connection.cancel"
- tapOn:
    id: "link.settings.about"
- assertVisible: "Version.*"
- assertVisible: "Revision.*"
- assertVisible: "Check log"
- tapOn:
    id: "button.connection.cancel"
- tapOn:
    id: "link.settings.community"
- assertVisible: "Report bug"
- scrollUntilVisible:
    element:
      text: "Discord community"
    direction: DOWN
- assertVisible: "Discord community"
- scrollUntilVisible:
    element:
      text: "Forum"
    direction: DOWN
- assertVisible: "Forum"
- scrollUntilVisible:
    element:
      text: "GitHub"
    direction: DOWN
- assertVisible: "GitHub"
- tapOn:
    id: "button.connection.cancel"
- tapOn:
    id: "button.connection.cancel"
