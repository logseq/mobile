appId: com.logseq.logseq
---
- launchApp
- extendedWaitUntil:
    visible: "Android E2E continuous first"
    timeout: 90000
- swipe:
    from:
      text: "Android E2E continuous first"
    direction: LEFT
- extendedWaitUntil:
    visible:
      id: "toolbar.outliner.selection"
    timeout: 5000
- assertVisible:
    id: "button.outliner.selection.outdent"
- assertVisible:
    id: "button.outliner.selection.done"
- takeScreenshot: tests/e2e/screenshots/android-selection-material
