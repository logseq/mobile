appId: com.logseq.app
---
- launchApp
- extendedWaitUntil:
    visible:
      id: "button.composer.expand"
    timeout: 30000
- assertVisible:
    id: "button.search"
- tapOn:
    id: "button.composer.expand"
- assertVisible:
    id: "field.composer"
- assertVisible:
    id: "button.attachment"
- assertVisible:
    id: "button.task-status"
- tapOn:
    id: "button.task-status"
- extendedWaitUntil:
    visible: "Todo"
    timeout: 5000
- tapOn: "Todo"
- tapOn:
    id: "field.composer"
- inputText: "Android E2E capture"
- assertVisible:
    id: "button.send"
    enabled: true
- tapOn:
    id: "button.send"
- hideKeyboard
- pressKey: BACK
- assertVisible:
    id: "button.composer.expand"
- tapOn:
    id: "button.search"
- assertVisible:
    id: "screen.search"
- assertVisible:
    id: "field.search"
- tapOn:
    id: "field.search"
- inputText: "Android E2E capture"
- hideKeyboard
- extendedWaitUntil:
    visible: "Android E2E capture"
    timeout: 30000
- tapOn:
    id: "search.result.*"
- extendedWaitUntil:
    visible:
      id: "screen.node"
    timeout: 10000
- assertVisible: "Android E2E capture"
- assertVisible:
    id: "button.block-task-status"
- pressKey: BACK
- assertVisible:
    id: "screen.search"
- assertVisible: "Android E2E capture"
# Returning to search restores focus to its field. Back first dismisses the
# Android IME; close the keyboard explicitly before testing route dismissal.
- hideKeyboard
- pressKey: BACK
- assertVisible:
    id: "button.composer.expand"
- scrollUntilVisible:
    element:
      text: "Android E2E capture"
    direction: DOWN
    timeout: 30000
    speed: 50
    visibilityPercentage: 50
    centerElement: true
- assertVisible:
    id: "button.block-task-status"
